name: Smoke test live site

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy Flutter Web to GitHub Pages
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Render live site
        shell: bash
        run: |
          set -euo pipefail
          google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=15000 \
            --window-size=1280,900 \
            --screenshot=/tmp/rig-car-live.png \
            --dump-dom \
            "https://liokingo2024-prog.github.io/rig-car/" \
            > /tmp/rig-car-dom.html

          grep -q '<flt-glass-pane' /tmp/rig-car-dom.html
          ! grep -q 'Loading your fleet dashboard' /tmp/rig-car-dom.html
          test -s /tmp/rig-car-live.png

      - name: Upload live screenshot
        uses: actions/upload-artifact@v6
        with:
          name: rig-car-live-screenshot
          path: /tmp/rig-car-live.png
