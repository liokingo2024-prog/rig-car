<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RIG-CAR: Godot 4 Car Auto-Rigger & Pre-Rigged Fleet Library.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RIG-CAR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RIG-CAR | Godot 4 Vehicle Auto-Rigger & Fleet Library</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
      background: #0a110e;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: #0a110e;
      color: #f3f4f6;
      overflow: hidden;
    }

    /* Dark emerald studio backdrop: the app paints over this, so the splash
       background must match the workbench instead of flashing a light card. */
    #app-fallback {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(600px 360px at 50% 35%, rgba(16, 185, 129, 0.14), transparent 70%),
        linear-gradient(rgba(16, 185, 129, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.04) 1px, transparent 1px),
        #0a110e;
      background-size: 100% 100%, 36px 36px, 36px 36px, 100% 100%;
      transition: opacity 260ms ease, transform 260ms ease;
    }

    #app-fallback.fade-out {
      opacity: 0;
      transform: scale(1.015);
      pointer-events: none;
    }

    .fallback-card {
      width: min(400px, 100%);
      padding: 32px 28px 28px;
      border: 1px solid rgba(16, 185, 129, 0.22);
      border-radius: 20px;
      background: rgba(17, 28, 24, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-align: center;
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .fallback-badge {
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.32);
    }

    .fallback-card h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f3f4f6;
    }

    .fallback-sub {
      margin: 0 0 22px;
      font-size: 13px;
      color: #86978c;
      letter-spacing: 0.02em;
    }

    .fallback-progress-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .fallback-progress-bar {
      width: 22%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #34d399);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
      transition: width 320ms cubic-bezier(0.22, 1, 0.36, 1);
      animation: pulse-bar 1.6s ease-in-out infinite;
    }

    #fallback-message {
      margin: 0;
      font-size: 12px;
      color: #9fb2a6;
      min-height: 18px;
    }

    @keyframes pulse-bar {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.22); }
    }
  </style>
</head>
<body>
  <main id="app-fallback" aria-live="polite">
    <section class="fallback-card">
      <div class="fallback-badge" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 17h14v-5l-2.2-4.4A2 2 0 0 0 15 6.5H9a2 2 0 0 0-1.8 1.1L5 12v5Z"/>
          <circle cx="7.5" cy="17.5" r="2"/>
          <circle cx="16.5" cy="17.5" r="2"/>
        </svg>
      </div>
      <h1>RIG-CAR</h1>
      <p class="fallback-sub">3D Vehicle Auto-Rigger &amp; Godot 4 Studio</p>
      <div class="fallback-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="fallback-bar" class="fallback-progress-bar"></div>
      </div>
      <p id="fallback-message">Loading 3D studio…</p>
      <noscript>JavaScript is required to run RIG-CAR.</noscript>
    </section>
  </main>
  <!--
    Loader scripts are deferred so the splash above paints before any of them is
    fetched or parsed. Deferral keeps the dependency order that these libraries
    rely on (three.js before the loaders, loaders before the viewer).
  -->
  <script defer src="js/three.min.js"></script>
  <script defer src="js/fflate.min.js"></script>
  <script defer src="js/jszip.min.js"></script>
  <script defer src="js/OrbitControls.js"></script>
  <script defer src="js/GLTFLoader.js"></script>
  <script defer src="js/OBJLoader.js"></script>
  <script defer src="js/STLLoader.js"></script>
  <script defer src="js/FBXLoader.js"></script>
  <!-- onnxruntime is only touched by the AI pass and is guarded by
       `typeof ort === 'undefined'`, so a slow CDN must not delay the viewer. -->
  <script async src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>
  <script defer src="js/sketchfab_viewer.js?v=20261122_v147_staged_boot"></script>
  <script src="flutter_bootstrap.js?v=20261122_v147_staged_boot" async></script>
</body>
</html>
