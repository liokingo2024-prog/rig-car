<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RIG-CAR fleet management dashboard.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RIG-CAR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RIG-CAR | Fleet dashboard</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #f5f7f8;
    }

    #app-fallback {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .fallback-card {
      width: min(420px, 100%);
      padding: 32px;
      box-sizing: border-box;
      border: 1px solid #e7ebee;
      border-radius: 20px;
      background: #ffffff;
      color: #17212b;
      text-align: center;
      box-shadow: 0 18px 48px rgba(23, 33, 43, 0.08);
    }

    .fallback-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #ff6b35;
      color: #ffffff;
      font-size: 24px;
      font-weight: 800;
    }

    .fallback-card h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .fallback-card p {
      margin: 0;
      color: #66737d;
      line-height: 1.5;
    }

    .fallback-spinner {
      width: 22px;
      height: 22px;
      margin: 20px auto 0;
      border: 3px solid #ffe4d2;
      border-top-color: #ff6b35;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main id="app-fallback" aria-live="polite">
    <section class="fallback-card">
      <div class="fallback-logo">⚡</div>
      <h1>RIG-CAR</h1>
      <p id="fallback-message">Loading your fleet dashboard…</p>
      <div class="fallback-spinner" aria-hidden="true"></div>
      <noscript>JavaScript is required to run the RIG-CAR dashboard.</noscript>
    </section>
  </main>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
